name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Lint
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run lint --if-present

      - name: Build
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build --if-present

      - name: Typecheck
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run typecheck --if-present

      - name: Baseline check (no app yet)
        if: ${{ hashFiles('package.json') == '' }}
        run: echo "Scaffold only — no package.json yet. CI baseline green."

  phi-guard:
    name: PHI-free zone guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # This zone must never collect health information or load ad pixels.
      # Fail the build if forbidden integrations appear in source.
      - name: Scan for forbidden trackers / PHI collection
        run: |
          set -e
          PATTERN='connect\.facebook\.net|fbevents\.js|googletagmanager\.com|google-analytics\.com|gtag\(|fbq\(|hotjar|clarity\.ms|tiktok.*pixel'
          if grep -rInE "$PATTERN" src/ 2>/dev/null; then
            echo "::error::Forbidden third-party tracker found in the PHI-free marketing zone."
            exit 1
          fi
          echo "No forbidden trackers found."
